# Inference config for the F2 critics (f2_sft, f2_dpo): same model geometry as
# training; weights come from weights/critic/<id>.pt (servers/critic_server.py).
project: CriticLLM
model_type: qwen3.5
activation_checkpointing: false
lightning:
  logdir: ${oc.env:CRITIC_RUNS}/logs
  version_name: CriticServe_F2
  logger_type: tensorboard
  save_checkpoint: true
  trainer:
    strategy: ddp
    precision: bf16-mixed
    max_steps: 0
    max_epochs: -1
    accumulate_grad_batches: 1   # unused at inference
    val_check_interval: 1
    check_val_every_n_epoch: null
    limit_val_batches: 1.0
    log_every_n_steps: 1
    num_sanity_val_steps: 1
data:
  target: critic.data.datamodules.CriticismDataModule
  params:
    db_path_train: null
    db_path_val: null
    model_path: ${oc.env:MIXAGENT_MODELS}/Qwen3.5-4B
    cache_dir: null
    batch_size: 1
    num_workers: 0
    use_chat: true
    audio_root: ${oc.env:CRITIC_DATA}
    embcache_root: ${oc.env:CRITIC_DATA}/embcache
model:
  target: critic.model.trainer.LMTrainingWrapper
  params:
    model_config:
      model_type: qwen3.5
      model_path: ${oc.env:MIXAGENT_MODELS}/Qwen3.5-4B
      cache_dir: null
      attn_implementation: sdpa
      precision: bf16-mixed
      expdir: ${oc.env:CRITIC_RUNS}/CriticServe_F2
      audio_encoder_type: rlat
      rlat_checkpoint: ${oc.env:MIXAGENT_MODELS}/rlat
      sao_model_path: ${oc.env:MIXAGENT_MODELS}/stable-audio-open-1.0
      audio_hidden_size: 1024
      projector_type: adapter
      projection_ckpt: null
      apply_lora: true
      lora_rank: 128
      lora_target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj]
      loss_type: ce
      input_length: 1664
      output_length: 768
      max_length: 2560
      init_weights_from: null
    optimizer_config:
      target: torch.optim.AdamW
      params:
        lr: 0.0
        weight_decay: 0.01
    scheduler_config:
      target: critic.model.utils.LinearWarmupCosineDecay
      params:
        warmup_steps: 0
        total_steps: 1
        min_lr: 0.0
